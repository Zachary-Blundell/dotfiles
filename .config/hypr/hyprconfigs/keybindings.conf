
# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
# Launchers
bind = $super, Space, togglefloating
bind = $super, C, pin # sticky window
bind = $super, Q, killactive,
# bind = $super, C, exec, conky-toggle
bind = $super, F, fullscreen
bind = $super SHIFT, R, exec, hyprctl reload
bind = CTRL SHIFT, Escape, exec, $term --class btop -T btop -e btop # Open btop

# Special Keys
bind = , xf86audioraisevolume, exec, $volume --inc
bind = , xf86audiolowervolume, exec, $volume --dec
bind = , xf86audiomute, exec, $volume --toggle
bind = , xf86audioplay, exec, playerctl play-pause
bind = , xf86audionext, exec, playerctl next
bind = , xf86audioprev, exec, playerctl previous
bind = , xf86audiostop, exec, playerctl stop
bind = , xf86monbrightnessup, exec, $brightness --inc
bind = , xf86monbrightnessdown, exec, $brightness --dec

# bind = $super, O, exec, $colorpicker
bind = $super SHIFT, O, exec, $term --class hyprpicker --hold -e hyprpicker
bind = $super CTRL, S, exec, $wofi_beats

# Screenshot keybindings
bind = , Print, exec, ~/.config/hypr/scripts/screenshot rc
bind = SUPER, Print, exec, ~/.config/hypr/scripts/screenshot rf
bind = CTRL, Print, exec, ~/.config/hypr/scripts/screenshot ri
bind = SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot sc
bind = SUPER SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot sf
bind = CTRL SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot si
bind = ALT, Print, exec, ~/.config/hypr/scripts/screenshot p
# bind = , Print, exec, $screenshot --now
# bind = $super, Print, exec, $screenshot --in5
# bind = SHIFT, Print, exec, $screenshot --in10
# bind = CTRL, Print, exec, $screenshot --win
# bind = $super CTRL, Print, exec, flameshot gui

# effects
bind = $super ALT, g, exec, $scriptsDir/glassmorphismToggle
# Output

bind = $super, Print, exec, grimblast save area

# Mainmod + Function keys
bind = $super, F1, exec, $browser
bind = $super, F2, exec, $editor
bind = $super, F3, exec, $email
bind = $super, F4, exec, $files
bind = $super, F5, exec, signal
bind = $super, F6, exec, teams
bind = $super, F7, exec, virtualbox
bind = $super, F8, exec, gimp
bind = $super, F9, exec, spotify
bind = $super, F10, exec, lollypop
bind = $super, F11, exec, rofi -show drun
bind = $super, F12, exec, rofi -show drun

