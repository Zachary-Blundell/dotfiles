
# See https://wiki.hyprland.org/Configuring/Variables/ for more

# Some default env vars
env = XCURSOR_SIZE,24


# with lock - hyprctl
# exec-once = swayidle -w timeout 1200 '$lock' timeout 1200 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on' before-sleep '$lock'

# with lock - swaylock
# exec-once = swayidle -w timeout 1200 'swaylock -f -c 111111' timeout 1200 '' resume '' before-sleep 'swaylock -f -c 111111'

# without lock
# exec-once = swayidle -w  timeout 1200 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on'


# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
# qwerty
  kb_layout = us,fr

# azerty
#kb_layout = be

    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
# 0 - Cursor movement will not change focus.
# 1 - Cursor movement will always change focus to the window under the cursor.
# 2 - Cursor focus will be detached from keyboard focus. Clicking on a window will move keyboard focus to that window.
# 3 - Cursor focus will be completely separate from keyboard focus. Clicking on a window will not change keyboard focus.
    numlock_by_default = false
    resolve_binds_by_sym = false # Determines how keybinds act when multiple layouts are used. 
# If false, keybinds will always act as if the first specified layout is active. 
# If true, keybinds specified by symbols are activated when you type the respective symbol with the current layout.

    touchpad {
      natural_scroll = true
        tap-to-click = true
        drag_lock = true
        disable_while_typing = true
    }

#sensitivity = 0.0 # -1.0 - 1.0, 0 means no modification
}

misc {
  disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
# no_direct_scanout = true #for fullscreen games
}

binds {
  workspace_back_and_forth = true
}


gestures {
  workspace_swipe = true
    workspace_swipe_fingers = 3
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
#device:epic mouse V1 {
#  sensitivity = -0.5
#}
cursor {
  # no_warps = true
  persistent_warps = true
# When a window is refocused, the cursor returns to its last position relative to that window, rather than to the centre.
  hide_on_key_press = true
}

