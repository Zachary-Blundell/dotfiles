# Configuration
font_family                 ProFontWindowsNerdFontMono
font_size                   16
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
remember_window_size        no
initial_window_width        950
initial_window_height       500
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        0
hide_window_decorations     yes
background_opacity          0.85
dynamic_background_opacity  yes
confirm_os_window_close     0
selection_foreground        none
selection_background        none
window_margin_width         4
map ctrl+shift+i set_background_opacity +0.1
map ctrl+shift+d set_background_opacity -0.1

# Animated cursor follows text
cursor_trail 1

# Include catppuccin colors
include $HOME/.config/kitty/catppuccin-mocha.conf
