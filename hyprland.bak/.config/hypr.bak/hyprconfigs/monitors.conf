# See https://wiki.hyprland.org/Configuring/Monitors/
monitor = DP-4, 1920x1080@60,0x0, 1

# monitor = DP-6, disabled
# monitor = DP-6, 1920x1080@60,1920x0, 1, transform, 1
# monitor = DP-6, 1920x1080@60,1920x0, 1,
# monitor = HDMI-A-6, disabled
# monitor = HDMI-A-6, 1920x1080@60, -1920x0, 1 
# monitor=HDMI-A-1,disabled

# # Auto catch all
# monitor=,preferred,auto,auto,mirror, DP-4
monitor=,disabled

# # Rotaion
# # 0 -> normal (no transforms)
# # 1 -> 90 degrees
# # 2 -> 180 degrees
# # 3 -> 270 degrees
# # 4 -> flipped
# # 5 -> flipped + 90 degrees
# # 6 -> flipped + 180 degrees
# # 7 -> flipped + 270 degrees
