# hyprctl clients
# ----------------------------
# Picture-in-Picture (named rule syntax)
# ----------------------------
windowrule {
  name = Picture-in-Picture
  match:title = ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
  float = on
  pin = on
  keep_aspect_ratio = off
  # move = (monitor_w*0.66) (monitor_h*.5)
  move = (monitor_w*0.66) 85
  # move  = 1265 84
  # move  = 1265 84
  size = 646 375
}

windowrule {
  name = Gnome Calulator
  match:title = ^([Cc]alculator)$
  float = on
  keep_aspect_ratio = on
  size = 440 550
}
windowrule {
  name = Android Emulator 
  match:title = ^(Emulator)$
  float = on
  keep_aspect_ratio = on
  size = 440 550
}
 

# ----------------------------
# Visual Timer app
# ----------------------------

windowrule {
  name = visualtimer-float
  match:class = ^(brave-thevisualtimer\.com__-Default)$

  float = true
  move = (monitor_w*0.66) 85
  size = 646 375
}

# ----------------------------
# idle inhibit rules
# ----------------------------
windowrule {
  name = idleinhibit-media-players
  match:class = ^(.*celluloid.*)$|^(.*mpv.*)$|^(.*vlc.*)$
  idle_inhibit = fullscreen
}

windowrule {
  name = idleinhibit-spotify
  match:class = ^(.*[Ss]potify.*)$
  idle_inhibit = fullscreen
}

windowrule {
  name = idleinhibit-browsers
  match:class = ^(.*LibreWolf.*)$|^(.*floorp.*)$|^(.*brave-browser.*)$|^(.*firefox.*)$|^(.*chromium.*)$|^(.*zen.*)$|^(.*vivaldi.*)$
  idle_inhibit = fullscreen
}

