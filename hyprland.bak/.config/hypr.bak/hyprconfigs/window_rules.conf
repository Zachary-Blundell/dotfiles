# ----------------------------
# Fix some dragging issues with XWayland (old: nofocus,...)
# ----------------------------
windowrule {
  name = xwayland-drag-fix
  match:class = ^$
  match:title = ^$
  match:xwayland = true
  match:float = true
  match:fullscreen = false
  match:pin = false
  no_focus = on
}
