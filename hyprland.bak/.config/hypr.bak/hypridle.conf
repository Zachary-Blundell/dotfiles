# Requires: hypridle, hyprlock (or your locker), loginctl/systemd

general {
  lock_cmd = pidof hyprlock || hyprlock
  unlock_cmd = pkill -USR1 hyprlock || true

  # Optional: ignore small mouse movements
  ignore_dbus_inhibit = false
}

# --- Lock screen after 5 minutes idle
listener {
  timeout = 600
  on-timeout = pidof hyprlock || hyprlock
}

# --- Turn displays off after 10 minutes idle
listener {
  timeout = 600
  on-timeout = hyprctl dispatch dpms off
  on-resume = hyprctl dispatch dpms on
}

# --- Suspend after 20 minutes idle
# (Lock first, then suspend)
listener {
  timeout = 1200
  on-timeout = pidof hyprlock || hyprlock; sleep 1; systemctl suspend
}

# --- If the laptop lid closes: lock + suspend
# This triggers when logind reports it; works on most laptops.
listener {
  on-lid-close = pidof hyprlock || hyprlock; sleep 1; systemctl suspend
  on-lid-open = hyprctl dispatch dpms on
}

# --- Before sleep: lock (covers manual suspend too)
listener {
  on-before-sleep = pidof hyprlock || hyprlock
}
