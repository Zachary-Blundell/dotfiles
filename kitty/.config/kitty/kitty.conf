include ~/.config/omarchy/current/theme/kitty.conf

#    __ ___ __  __
#   / //_(_) /_/ /___ __
#  / ,< / / __/ __/ // /
# /_/|_/_/\__/\__/\_, /
#                /___/
#
# Configuration

# Font
font_family JetBrainsMono Nerd Font
# font_family                 ProFontWindowsNerdFontMono
font_size                   12
bold_font                   auto
italic_font                 auto
bold_italic_font            auto

# Animated cursor follows text
cursor_trail 1

# Window
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
map ctrl+shift+i set_background_opacity +0.1
map ctrl+shift+d set_background_opacity -0.1

# Allow remote access
allow_remote_control yes

# Aesthetics
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
enable_audio_bell no
background_opacity          0.85
window_margin_width         0

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# remember_window_size        no
# initial_window_width        950
# initial_window_height       500
# cursor_blink_interval       0.5
# cursor_stop_blinking_after  1
# scrollback_lines            2000
